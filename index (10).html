<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le fil rouge</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;touch-action:none;background:#0a0206;color:#f5e6e8;font-family:"Cormorant Garamond",Georgia,serif;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 40%,#3a0a1c 0%,#14040b 60%,#070104 100%)}
#c{position:fixed;inset:0;pointer-events:none;z-index:12;transition:opacity 1.2s}
#cap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 7vh);left:0;right:0;text-align:center;font:italic 22px "Playfair Display",Georgia,serif;padding:0 24px;transition:opacity .6s;pointer-events:none;z-index:15}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);left:0;right:0;text-align:center;font-style:italic;font-size:18px;opacity:.8;transition:opacity .6s;pointer-events:none;z-index:15}
#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#3a0a1c 0%,#14040b 70%);z-index:20;transition:opacity 1s}
#setup.off{opacity:0;pointer-events:none}
#setup h1{font:italic 40px "Playfair Display",Georgia,serif;color:#ff4f86;text-shadow:0 0 22px #ff1f5a}
#setup p{font-size:20px;opacity:.85;max-width:340px}
#nom{width:min(320px,86vw);padding:14px 18px;border-radius:30px;border:1px solid #ff4f86;background:rgba(255,255,255,.06);color:#fff;font:500 22px "Cormorant Garamond",Georgia,serif;text-align:center;outline:none}
#nom:focus{box-shadow:0 0 18px rgba(255,45,106,.5)}
button{font:500 20px "Cormorant Garamond",Georgia,serif;padding:12px 30px;border-radius:30px;border:0;background:#c8203f;color:#fff;cursor:pointer;box-shadow:0 0 18px rgba(255,45,106,.35)}
button.alt{background:transparent;border:1px solid #ff9bb8;color:#ff9bb8;box-shadow:none}
#s2{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:10;touch-action:none}
#s2.on{opacity:1;pointer-events:auto}
#parch{--w:min(90vw,460px,calc((100dvh - 170px)*.703));position:relative;width:var(--w);height:calc(var(--w)*.1513);transition:height 1.5s cubic-bezier(.4,0,.2,1)}
#parch.open{height:calc(var(--w)*1.4221)}
#parch img{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
#roll{filter:drop-shadow(0 8px 14px rgba(0,0,0,.65));border-radius:12px;transition:opacity .6s .5s}
#sheet{opacity:0;clip-path:inset(47% -30px 47% -30px);transition:clip-path 1.5s cubic-bezier(.4,0,.2,1),opacity .4s}
#parch.open #roll{opacity:0}
#parch.open #sheet{opacity:1;clip-path:inset(-30px)}
#lettre{position:absolute;left:12%;right:12%;top:15%;bottom:16%;display:flex;flex-direction:column;opacity:0;transition:opacity 1s;color:#3b2314;touch-action:auto;z-index:3}
#lettre h2{font:italic 24px "Playfair Display",Georgia,serif;color:#7c1c2c;margin-bottom:8px}
#txt,#lu{flex:1;min-height:0;width:100%;border:0;background:transparent;resize:none;outline:none;font:500 20px/1.4 "Cormorant Garamond",Georgia,serif;color:#3b2314;overflow-y:auto;white-space:pre-wrap}
#txt::placeholder,#sig::placeholder{color:rgba(90,50,20,.5)}
#lu{display:none}
#sig,#sigout{margin-top:6px;text-align:right;font:italic 22px "Playfair Display",Georgia,serif;color:#7c1c2c;border:0;border-bottom:1px solid rgba(90,50,20,.35);background:transparent;outline:none;width:100%}
#sigout{display:none;border:0;min-height:30px}
#btnbox{position:absolute;left:0;right:0;top:100%;margin-top:14px;opacity:0;pointer-events:none;transition:opacity 1s;z-index:3}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#after{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap"></div>
<div id="hint"></div>

<div id="setup">
  <h1>Le fil rouge</h1>
  <p>Écris le prénom de la personne à qui tu offres cette lettre.</p>
  <input id="nom" type="text" maxlength="24" placeholder="Prénom de ton ou ta partenaire" autocomplete="off">
  <button id="go">Commencer</button>
</div>

      V.push({
        x:.5*(2*p1.x+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),

    }
  }
  V.push(C[C.length-1]);
  let len=0;
  for(let i=1;i<V.length;i++)len+=Math.hypot(V[i].x-V[i-1].x,V[i].y-V[i-1].y);

      }
    }
    pin();
  }

function smooth(P){
  const R=[{x:P[0].x,y:P[0].y}];
  let px=P[0].x,py=P[0].y;
  for(let i=1;i<P.length-1;i++){
    const mx=(P[i].x+P[i+1].x)/2,my=(P[i].y+P[i+1].y)/2;
    for(let k=1;k<=5;k++){
      const t=k/5,a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;
      R.push({x:a*px+b*P[i].x+c*mx,y:a*py+b*P[i].y+c*my});
    }
    px=mx;py=my;
  }
  R.push({x:P[P.length-1].x,y:P[P.length-1].y});
  return R;
}

  for(let i=1;i<A.length;i++){

    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);

  for(;;){
    pts=[];
    for(let y=0;y<H;y+=g)for(let x=0;x<W;x+=g)if(m(x,y)&&(!m(x-g,y)||!m(x+g,y)||!m(x,y-g)||!m(x,y+g)))pts.push([x,y]);
    if(pts.length<=3000)break;
    g++;
  }
  const n=pts.length,used=new Uint8Array(n);
  let cur=0;
  for(let i=1;i<n;i++)if(pts[i][0]<pts[cur][0])cur=i;
  used[cur]=1;chain=[pts[cur]];
  for(let k=1;k<n;k++){
    let b=-1,bd=1e12;
    const px=pts[cur][0],py=pts[cur][1];
    for(let j=0;j<n;j++){
      if(used[j])continue;
      const dx=pts[j][0]-px,dy=pts[j][1]-py,d2=dx*dx+dy*dy;
      if(d2<bd){bd=d2;b=j}
    }
    used[b]=1;cur=b;chain.push(pts[b]);
  }
}
function toName(){
  stage="toname";ptr.down=false;grab=-1;
  buildChain();
  const M=chain.length,S=resample(P,M);
  Q=S.map((p,j)=>({x:p.x,y:p.y,tx:chain[j][0],ty:chain[j][1],d:j/M*2.8}));
  tn=performance.now();
  say("Le mien arrive toujours jusqu’à toi.","");
  setTimeout(toScroll,8500);
}
function bowPos(){const r=parch.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function wrapPts(bx,by){
  const hh=parch.getBoundingClientRect().height/2*.92,V=[];
  for(let k=0;k<=12;k++)V.push({x:bx-40+k*6.6,y:k%2?by+hh:by-hh});
  V.push({x:bx,y:by});
  return V;
}
function tailPts(bx,by,x,y,n){
  const A=[],qx=bx+(x-bx)*.2+34,qy=by+(y-by)*.55;
  for(let i=0;i<=n;i++){
    const t=i/n,a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;
    A.push({x:a*bx+b*qx+c*x,y:a*by+b*qy+c*y});
  }
  return A;
}
function bowPts(bx,by){
  const V=[{x:bx-14,y:by+28},{x:bx,y:by}];
  for(let i=0;i<=24;i++){const t=i/24*Math.PI*2;V.push({x:bx-21+21*Math.cos(t),y:by-12*Math.sin(t)})}
  V.push({x:bx,y:by});
  for(let i=0;i<=24;i++){const t=i/24*Math.PI*2;V.push({x:bx+21-21*Math.cos(t),y:by-12*Math.sin(t)})}
  V.push({x:bx,y:by},{x:bx+14,y:by+28});
  return V;
}
function resample(V,M){
  const L=[0];
  for(let i=1;i<V.length;i++)L.push(L[i-1]+Math.hypot(V[i].x-V[i-1].x,V[i].y-V[i-1].y));
  const T=L[L.length-1],R=[];
  let k=1;
  for(let j=0;j<M;j++){
    const s=T*j/(M-1);
    while(k<V.length-1&&L[k]<s)k++;
    const u=(s-L[k-1])/((L[k]-L[k-1])||1);
    R.push({x:V[k-1].x+(V[k].x-V[k-1].x)*u,y:V[k-1].y+(V[k].y-V[k-1].y)*u});
  }
  return R;
}
function toScroll(){
  stage="toscroll";
  s2.classList.add("on");
  const[bx,by]=bowPos();
  baseLen=Math.min(170,H*.26);
  rx=bx+26;ry=by+baseLen;hx=rx;hy=ry;
  const T=resample(wrapPts(bx,by).concat(tailPts(bx,by,rx,ry,30)),Q.length);
  Q.forEach((q,j)=>{q.tx=T[j].x;q.ty=T[j].y;q.d=j/Q.length*2.8});
  tn=performance.now();
  say("Tire le fil","");
  setTimeout(()=>{stage="scroll";bowA=0;hint.textContent="Tire le fil vers le bas";hint.style.opacity=.8},5600);
}
function openScroll(){
  opened=true;dr=false;
  document.documentElement.style.touchAction="auto";document.body.style.touchAction="auto";s2.style.touchAction="auto";
  cap.style.opacity=0;hint.style.opacity=0;
  setTimeout(()=>{cv.style.opacity=0},700);
  setTimeout(()=>parch.classList.add("open"),900);
  setTimeout(()=>{$("#lettre").style.opacity=1;$("#btnbox").style.opacity=1;$("#btnbox").style.pointerEvents="auto";startLetter()},2800);
}
function frame(now){
  cx.clearRect(0,0,W,H);
  twT=Math.max(6,Math.min(9,W*.02))*(stage==="toname"?.68:1);
  tw+=(twT-tw)*.04;
  if(stage==="play"){
    step();drawRope(1);
    if(energy>200)hint.style.opacity=0;
  }else if(stage==="toname"||stage==="toscroll"){
    const el=(now-tn)/1000;
    for(const q of Q){if(el>q.d){q.x+=(q.tx-q.x)*.085;q.y+=(q.ty-q.y)*.085}}
    if(stage==="toname"){
      drawPoly(Q,1,2.6,46);
      const a=Math.min(1,Math.max(0,(el-3.2)/2))*.16;
      if(a>0){cx.save();cx.font=nameFont;cx.textAlign="center";cx.textBaseline="middle";cx.fillStyle="rgba(255,80,130,"+a+")";cx.shadowColor="#ff1f5a";cx.shadowBlur=20;cx.fillText(nom,W/2,H*.45);cx.restore()}
    }else drawPoly(Q,1,3);
  }else if(stage==="scroll"){
    const[bx,by]=bowPos();
    rx=bx+26;ry=by+baseLen;
    if(!dr&&!opened){hx+=(rx-hx)*.14;hy+=(ry-hy)*.14}
    const p=Math.min(1,Math.max(0,(Math.hypot(hx-bx,hy-by)-baseLen)/130));
    if(dr)stitch=Math.max(stitch,p);
    const V=wrapPts(bx,by),n=(V.length-1)*(1-stitch),i0=Math.floor(n),u=n-i0;
    const E=i0>=V.length-1?V[V.length-1]:{x:V[i0].x+(V[i0+1].x-V[i0].x)*u,y:V[i0].y+(V[i0+1].y-V[i0].y)*u};
    if(n>0)drawPoly(dense(V.slice(0,i0+1).concat([E])),1,0);
    drawPoly(dense(tailPts(E.x,E.y,hx,hy,24)),1,0);
    bowA=Math.min(1,bowA+.025);
    yarn(dense(bowPts(bx,by)),bowA,0);
    cx.save();
    cx.globalAlpha=opened?0:1;
    cx.fillStyle="#d81e2c";cx.shadowColor="#000";cx.shadowBlur=6;cx.beginPath();cx.arc(hx,hy,tw*.75,0,7);cx.fill();
    cx.shadowBlur=0;cx.strokeStyle="rgba(255,255,255,.55)";cx.lineWidth=1.5;cx.beginPath();cx.arc(hx,hy,tw*.75+6+Math.sin(now/280)*2,0,7);cx.stroke();
    cx.restore();
    if(stitch>=1&&!opened)openScroll();
  }
  drawSparks();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.addEventListener("pointerdown",e=>{
  if(stage==="play"){
    const x=e.clientX,y=e.clientY;
    let best=1e9,gi=-1;
    if(Math.hypot(P[0].x-x,P[0].y-y)<110)gi=0;
    else for(let i=1;i<P.length-1;i++){const d=Math.hypot(P[i].x-x,P[i].y-y);if(d<best&&d<70){best=d;gi=i}}
    if(gi>=0){grab=gi;ptr.down=true;ptr.x=x;ptr.y=y;ptr.m=0}
  }else if(stage==="scroll"&&!opened){
    const d=Math.hypot(e.clientX-hx,e.clientY-hy);
    if(d<60){dr=true;hx=e.clientX;hy=e.clientY}
  }
});
window.addEventListener("pointermove",e=>{
  if(stage==="play"&&ptr.down){
    const ddx=e.clientX-ptr.x,ddy=e.clientY-ptr.y,mv=Math.hypot(ddx,ddy);
    energy+=mv;ptr.m+=mv;
    ptr.x=e.clientX;ptr.y=e.clientY;
    emit(ptr.x,ptr.y,ddx,ddy);
  }else if(stage==="scroll"&&dr&&!opened){emit(e.clientX,e.clientY,e.clientX-hx,e.clientY-hy);hx=e.clientX;hy=e.clientY}
});
function up(){
  if(stage==="play"&&ptr.down){
    ptr.down=false;grab=-1;
    if(ptr.m>80){
      burst(ptr.x,ptr.y);
      cs++;
      if(cs===1)say("Il peut s’emmêler.");
      if(cs===3)say("Il peut s’étirer.");
      if(cs===4)say("Il ne se rompt jamais.");
      if(cs>=5)toName();
    }
  }
  dr=false;
}
window.addEventListener("pointerup",up);
window.addEventListener("pointercancel",up);

function begin(){
  const go=()=>{
    initRope();energy=0;cs=0;stage="play";
    $("#setup").classList.add("off");
    $("#pour").textContent="Pour "+nom;
    cap.textContent="On dit qu’un fil rouge relie deux personnes.";cap.style.opacity=1;
    hint.textContent="Fais glisser le bout du fil avec ton doigt, plusieurs fois";hint.style.opacity=.8;
  };
  const t=setTimeout(go,1500);
  document.fonts.load("italic 500 40px \"Cormorant Garamond\"").then(()=>{clearTimeout(t);go()}).catch(()=>{clearTimeout(t);go()});
}
$("#go").onclick=()=>{
  const v=$("#nom").value.trim();
  if(!v){$("#nom").focus();return}
  nom=v;begin();
};
$("#nom").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
if(slug&&useDb){
  $("#setup").innerHTML="<p>Ouverture de ta lettre…</p>";
  rpc("lire_lettre",{p_slug:slug}).then(rows=>{
    if(!rows||!rows.length)throw new Error("none");
    nom=rows[0].prenom;
    data={n:nom,t:rows[0].lettre,s:rows[0].signature||""};
    reader=true;
    begin();
  }).catch(()=>{$("#setup").innerHTML="<p>Cette lettre est introuvable.</p>"});
}else if(slug){
  $("#setup").innerHTML="<p>Cette lettre est introuvable.</p>";
}else if(reader){$("#setup").style.display="none";begin()}

function type(el,t,cb){
  el.textContent="";let i=0;
  const iv=setInterval(()=>{
    el.textContent=t.slice(0,++i);el.scrollTop=el.scrollHeight;
    if(i>=t.length){clearInterval(iv);if(cb)cb()}
  },30);
}
function showRead(withButtons){
  $("#txt").style.display="none";$("#sig").style.display="none";$("#before").style.display="none";
  lu.style.display="block";sigout.style.display="block";sigout.textContent="";
  $("#after").style.display="none";
  type(lu,data.t,()=>{
    sigout.textContent=data.s||"";
    if(withButtons)$("#after").style.display="flex";
  });
}
function startLetter(){
  if(reader){showRead(false);return}
  $("#txt").focus();
}
$("#fin").onclick=async()=>{
  const t=$("#txt").value.trim();
  if(!t){$("#txt").focus();return}
  data={n:nom,t,s:$("#sig").value.trim()};
  const b=$("#fin");
  if(useDb){
    b.disabled=true;b.textContent="Enregistrement…";
    try{
      const sl=await rpc("creer_lettre",{p_prenom:nom,p_lettre:t,p_signature:data.s||null});
      link=location.href.split(/[?#]/)[0]+"?l="+sl;
    }catch(e){
      b.disabled=false;b.textContent="Réessayer";return;
    }
    b.disabled=false;b.textContent="Terminer";
  }
  showRead(true);
};
function getLink(){
  if(useDb)return link;
  return location.href.split(/[?#]/)[0]+"#"+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
$("#lien").onclick=()=>{
  const u=getLink();
  const ok=()=>{$("#lien").textContent="Lien copié ✓"};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok).catch(()=>window.prompt("Copie ce lien :",u));
  else window.prompt("Copie ce lien :",u);
};
if(navigator.share)$("#part").onclick=()=>{navigator.share({title:"Une lettre pour toi",text:"J’ai écrit une lettre pour toi…",url:getLink()}).catch(()=>{})};
else $("#part").style.display="none";
</script>
